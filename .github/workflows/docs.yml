name: docs
# On every push and PR, checks that repository-internal links and image references in tracked
# Markdown files point to existing files, and that document anchor links (#heading) point to headings
# that actually exist in the target document, so broken links, images, and anchors cannot be merged.
# Link targets can be anywhere in the repository (e.g. ../LICENSE or screenshots/en/*.png), so this
# runs on every change without a paths filter. External URLs (http/https/mailto) are not checked because
# they depend on the network and are flaky; scripts/check-doc-links.py checks only internal references.
# It uses only the Python standard library and makes no network connections, so it finishes
# deterministically and does not flap due to external factors such as Docker Hub rate limits. Go build,
# static analysis, and tests are handled by ci.yml, detection-rule reproduction by detections.yml, and
# the web UI build by web.yml.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# When a new push arrives on the same branch, cancel the earlier run so that unnecessary runs do not pile up.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artex-global
    steps:
      - uses: actions/checkout@v4
      # python3 is preinstalled on the ubuntu-latest runner, and the script uses only the
      # standard library, so no install step is needed. -I isolates the user site and environment.
      - name: Check internal document link, image, and anchor integrity
        run: python3 -I scripts/check-doc-links.py
