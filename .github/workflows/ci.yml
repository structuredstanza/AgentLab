name: ci
# Run build, static analysis, and tests on every push and PR, so that regressions introduced by the
# before merging. The release workflow (release.yml) runs only on tags (v*) and only builds and deploys
# and only builds and deploys, so this workflow is responsible for verifying everyday changes.
#
# The workflows live at the git root; the Go module and the Next.js app are in m1nervac0nsole/, so every
# job that builds them runs with m1nervac0nsole as its working directory.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs the build, static analysis, and tests without a database. After a contributor clones the repository
  # Reproduce the environment where `go test ./...` runs without PostgreSQL. The database
  # that require a database are skipped in this environment via t.Skipf (skips are counted as passes),
  # All unit tests that do not use the build, go vet, or DB must be green. This combination alone
  # catches regressions that cross package boundaries (for example, changing a string in one package while
  # ...can catch cases that break assertions before merge.
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m1nervac0nsole
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The go directive in go.mod is the single source of truth for the toolchain.
          go-version-file: m1nervac0nsole/go.mod
          cache: true
          cache-dependency-path: m1nervac0nsole/go.sum
      - name: English-only source check
        run: python3 -I scripts/check-cjk.py
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go vet (owned SDK)
        run: go vet github.com/structuredstanza/norma/...
      - name: go test (no DB — integration tests skipped)
        run: go test ./... -count=1
      - name: go test (owned SDK)
        run: go test github.com/structuredstanza/norma/... -count=1
      # The browser driver's unit tests run against a fake CDP; this is the only
      # job that launches a real browser, so a launch-flag or pipe regression
      # cannot reach main unobserved.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: go test (real Chromium driver)
        env:
          M1NERVAC0NSOLE_BROWSER_INTEGRATION: "1"
          M1NERVAC0NSOLE_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: go test ./browser/ -run TestIntegration -count=1 -v
      # The isolation proof is the one suite that must never pass by skipping:
      # without root every kernel test reports BLOCKED, so a green run would say
      # nothing about the boundary. This step runs it as root and fails when a
      # test skipped, so "the boundary was not exercised" is a red build.
      # The kernel tests assert host-wide state (netns, iptables chains), so the
      # packages must not overlap: `-p 1` runs them one after the other. Running
      # them together let one package's live session fail the other's teardown check.
      - name: go test (execbox kernel · root · fails on skip)
        run: |
          set -euo pipefail
          log="$(mktemp)"
          sudo env "PATH=$PATH" "HOME=$HOME" "GOPATH=$(go env GOPATH)" "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" \
            go test -p 1 ./execbox/ ./server/ -run 'TestKernel' -count=1 -v 2>&1 | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then
            echo "::error::the execbox kernel tests skipped, so isolation is unproven"
            exit 1
          fi

  # Takes charge of DB integration tests (notifications, evidence, usage metering, etc.) that only run when a real PostgreSQL is available.
  # Forces the paths the go job above skips (notification channel validation, evidence storage, llm_usage metering, etc.) against a real
  # database, so that Korean-localization regressions that only surface on the DB integration path are also caught before merge.
  #
  # The upstream test harness is designed for all packages to share one database, with tables created only once
  # Running everything against one database therefore breaks in different ways: accumulated data
  # so running everything against one database breaks in different ways (accumulated data
  # contamination, connection teardown races, and cross-package schema dependencies on reset). That is why each package is run here separately.
  # Spin up a dedicated PostgreSQL service so each run is isolated as "empty database + single package." Each
  # package runs as its own independent job (matrix), so none of them touch each other's data, connections, or schema; that conflict is structurally eliminated.
  # db.Open automatically migrates the schema. Tables that db.Open does not create, such as llm_usage,
  # Each test ensures on its own, via EnsureLLMUsageTable, that any table db.Open does not create exists.
  go-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m1nervac0nsole
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, enrich, evidence, guard, intercept, llmrec, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: m1nervac0nsole
          POSTGRES_PASSWORD: m1nervac0nsole
          POSTGRES_DB: m1nervac0nsole
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m1nervac0nsole -d m1nervac0nsole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: m1nervac0nsole/go.mod
          cache: true
          cache-dependency-path: m1nervac0nsole/go.sum
      - name: go test (DB integration · isolated ${{ matrix.pkg }} package)
        env:
          M1NERVAC0NSOLE_PG_DSN: postgres://m1nervac0nsole:m1nervac0nsole@localhost:5432/m1nervac0nsole?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1

  # The exporter and the browser extension have their own suites under deployment/ at the git root, and
  # nothing ran them: test_export_traces.py carries the training-data redaction and malformed-record cases,
  # and test_extension_capture.mjs covers what the extension posts to /api/traffic/ingest. Both are plain
  # interpreters with no services, so they run here rather than in a database job. The lab/guest tests
  # share the same stdlib unittest discovery.
  deployment-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: deployment and lab suites (stdlib unittest · redaction, malformed records, VM guard)
        run: python3 -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: extension capture suite (CDP events → ingest payload)
        run: node --test deployment/test_extension_capture.mjs
