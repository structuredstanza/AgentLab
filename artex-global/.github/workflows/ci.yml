name: ci
# Run build, static analysis, and tests on every push and PR, so that regressions introduced by the
# before merging. The release workflow (release.yml) runs only on tags (v*) and only builds and deploys
# and only builds and deploys, so this workflow is responsible for verifying everyday changes.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs the build, static analysis, and tests without a database. After a contributor clones the repository
  # Reproduce the environment where `go test ./...` runs without PostgreSQL. The database
  # that require a database are skipped in this environment via t.Skipf (skips are counted as passes),
  # All unit tests that do not use the build, go vet, or DB must be green. This combination alone
  # catches regressions that cross package boundaries (for example, changing a string in one package while
  # ...can catch cases that break assertions before merge.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go vet (owned SDK)
        run: go vet github.com/Autumn-27/norma/...
      - name: go test (no DB — integration tests skipped)
        run: go test ./... -count=1
      - name: go test (owned SDK)
        run: go test github.com/Autumn-27/norma/... -count=1

  # Takes charge of DB integration tests (notifications, evidence, usage metering, etc.) that only run when a real PostgreSQL is available.
  # Forces the paths the go job above skips (notification channel validation, evidence storage, llm_usage metering, etc.) against a real
  # database, so that Korean-localization regressions that only surface on the DB integration path are also caught before merge.
  #
  # The upstream test harness is designed for all packages to share one database, with tables created only once
  # Running everything against one database therefore breaks in different ways: accumulated data
  # so running everything against one database breaks in different ways (accumulated data
  # contamination, connection teardown races, and cross-package schema dependencies on reset). That is why each package is run here separately.
  # Spin up a dedicated PostgreSQL service so each run is isolated as "empty database + single package." Each
  # package runs as its own independent job (matrix), so none of them touch each other's data, connections, or schema; that conflict is structurally eliminated.
  # db.Open automatically migrates the schema. Tables that db.Open does not create, such as llm_usage,
  # Each test ensures on its own, via EnsureLLMUsageTable, that any table db.Open does not create exists.
  go-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, evidence, llmrec, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test (DB integration · isolated ${{ matrix.pkg }} package)
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1

  # The exporter and the browser extension have their own suites under deployment/, and nothing ran them:
  # test_export_traces.py carries the training-data redaction and malformed-record cases, and
  # test_extension_capture.mjs covers what the extension posts to /api/traffic/ingest. Both are plain
  # interpreters with no services, so they run here rather than in a database job.
  deployment-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: exporter suite (redaction, malformed records, atomic output)
        run: cd deployment && python3 -m unittest test_export_traces -v
      - name: extension capture suite (CDP events → ingest payload)
        run: cd deployment && node --test test_extension_capture.mjs
