name: web
# Run the static export build of the Korean UI (web/) on every push and PR to catch frontend regressions
# before merge. The release workflow (release.yml) builds web only on tags (v*), and
# This fork has no tag push history, so it has never been run even once — so the routine web
# verifying routine web changes (TypeScript, React, i18n, next-intl). Go
# builds and tests are handled by ci.yml, so this runs only when web/ changes (paths filter).
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  # The static export build is the merge gate. `NEXT_EXPORT=1 next build` in next.config
  # There is no typescript.ignoreBuildErrors setting, so TypeScript type checking is also performed together,
  # If there are type errors or export failures, this job turns red and stops, blocking the merge.
  #
  # The biome lint is also a merge gate. After clearing the legacy lint debt (G7) inherited from upstream down to 0
  # (errors 8→0: 6 a11y in the skills tree + 1 package.json formatter + 1 noSvgWithoutTitle in logo.svg),
  # the informational step was promoted to a gate. Now, if `npm run check` (biome check) reports any errors, this
  # job turns red and stops, blocking the merge, which prevents a regression where the cleaned-up state gets dirtied again.
  # Warnings and info messages do not affect the exit code (biome exits with non-0 only at the error level), so they do not block merging.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: unit tests (merge gate · vitest)
        run: npm run test -- --run
      - name: build:static (merge gate · includes type check)
        run: npm run build:static
      - name: UI Han-character leak guard (merge gate · no Chinese characters in out HTML)
        # The core achievement of this fork is that "there is no Chinese text on the screens visible to users."
        # Prevents regressions where contributors hardcode Chinese text or omit translations, catching them before merge.
        # The script locates web/out under the git root by itself, so it does not depend on the working directory.
        run: python3 -I ../scripts/check-web-cjk.py
      - name: biome check (merge gate · zero lint, format, and a11y errors)
        if: always()
        run: npm run check
