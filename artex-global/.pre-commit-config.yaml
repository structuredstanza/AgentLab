# Example pre-commit configuration (see https://pre-commit.com)
#
# Runs the two deterministic merge gates of the repository's CI locally at commit time, so a broken
# change is caught before it is pushed. If an assertion fails in either hook, the script exits non-zero
# and the commit stops.
#
# 1) detections: runs the runner (detections/tests/run-all.sh) that executes the eight detection tests
#    and three gates, only in commits that change detection rules (detections/), the upstream sources
#    they pin, or the inline Sigma template in the defense guide (docs/defense-en.md). It applies the same
#    rule and source scope as CI (the git root's .github/workflows/detections.yml), so it catches a change that edits a
#    rule without updating its tests or layers, or that edits the defense template without updating the
#    guide's claims about it. It requires Docker (each test runs isolated in a container; nothing is
#    installed on the runner).
# 2) docs: checks that repository-internal links, images, and anchors (#headings) in tracked Markdown
#    files point to existing targets (scripts/check-doc-links.py). This is the same check as CI
#    (.github/workflows/docs.yml at the git root), which runs on every change without a paths filter, so the target set
#    is not narrowed here either (always_run). Links break not only when a .md file changes but also when
#    a file they point to (an image, LICENSE, etc.) is deleted or moved. It uses only the Python standard
#    library and makes no network connections, so it finishes in tens of milliseconds without Docker.
#
# Install:     pip install pre-commit && pre-commit install
# Manual run:  pre-commit run detections --all-files
#              pre-commit run docs --all-files
#
# This is a minimal example with only the two hooks. To add Go or web linting, add your own hooks below.
repos:
  - repo: local
    hooks:
      - id: detections
        name: Detection rule tests (8 suites: Sigma, Suricata, ATT&CK, indicators, MISP)
        entry: detections/tests/run-all.sh
        language: script
        pass_filenames: false
        files: '^(detections/|enrich/enrich\.go|guard/guard\.go|db/db\.go|db/schema\.sql|cmd/artex/main\.go|traffic/traffic\.go|docs/defense-en\.md)'
      - id: docs
        name: Check internal document links, images, and anchor (#heading) integrity
        entry: python3 -I scripts/check-doc-links.py
        language: system
        pass_filenames: false
        always_run: true
