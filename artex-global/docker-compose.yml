services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # Image this fork publishes to GitHub Container Registry on every release tag (v*)
    # (the docker job in .github/workflows/release.yml). The upstream autumn27/artex was removed from Docker Hub.
    image: ghcr.io/jiwoochris/artex-global:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # First-run protection. If empty, a random setup token is printed to the startup log, and
      # you must enter it on /setup to create the admin password (check with docker compose logs artex).
      # Setting ARTEX_ADMIN_PASSWORD initializes immediately with that value, skipping /setup (8+ characters).
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      # Browser cross-origin allowlist (comma-separated). The built-in UI is same-origin, so usually leave empty.
      ARTEX_CORS_ORIGINS: ${ARTEX_CORS_ORIGINS:-}
    ports:
      # Ports are published only on the host's 127.0.0.1 by default. To reach it from other machines, set
      # ARTEX_BIND=0.0.0.0 in .env, but first finish the initial setup (admin password) and,
      # if possible, use the reverse-proxy (HTTPS) setup described in the README.
      - "${ARTEX_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Binds the data directory (including jwt.key, SQLite, etc.) to data/ in the project root.
      # You can inspect and back it up from the host, and it survives container recreation.
      - ./data:/app/data
      # Mounts the project-root skills into the container (overrides /app/skills built into the image).
      # After editing a skill, the container reads the host file directly; no image rebuild is needed.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
