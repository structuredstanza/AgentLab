id = "whatweb"
name = "WhatWeb"
description = "Fingerprints the technologies a web service runs"
category = "web"
accepts = ["url", "domain", "subdomain"]
requires = ["whatweb"]

[params]
aggression = { type = "enum", label = "Aggression", default = "1", options = ["1", "3", "4"], description = "1 is passive, 3 is aggressive, 4 is heavy and may trip a WAF" }

[command]
program = "whatweb"
args = ["--log-json=/dev/stdout", "--no-errors", "-a", "{{ params.aggression }}", "{{ target.value }}", "--user-agent", "{{ useragent }}", "{{ proxyhost | --proxy }}"]
timeout_seconds = 600

[emit]
parser = "jsonl"
fields = ["target", "http_status", "plugins"]

[[emit.facts]]
kind = "technology"
data = { url = "{{ record.target }}", status_code = "{{ record.http_status }}" }
