id = "ffuf"
name = "ffuf"
description = "Content and parameter discovery, parsed from its streaming JSONL matches"
category = "web"
accepts = ["url", "domain", "subdomain"]
requires = ["ffuf"]

[params]
wordlist = { type = "string", label = "Wordlist", placeholder = "/usr/share/wordlists/common.txt", default = "/usr/share/seclists/Discovery/Web-Content/common.txt", required = true }
extensions = { type = "string", label = "Extensions", placeholder = "php,html,bak" }
match_codes = { type = "string", label = "Match status codes", default = "200,204,301,302,307,401,403" }
rate = { type = "number", label = "Requests per second", default = "50" }

[command]
program = "ffuf"
args = ["-u", "{{ target.value }}/FUZZ", "-w", "{{ params.wordlist }}", "-json", "-noninteractive", "-mc", "{{ params.match_codes }}", "-rate", "{{ params.rate }}", "{{ params.extensions | -e }}", "{{ proxy | -x }}", "-H", "User-Agent: {{ useragent }}"]
timeout_seconds = 1800

[limits]
param = "rate"
unit = "rps"

[emit]
parser = "jsonl"
fields = ["url", "status", "length", "words", "content-type"]

[[emit.targets]]
kind = "url"
value = "{{ record.url }}"
parent = "input"

[[emit.facts]]
kind = "http_service"
data = { url = "{{ record.url }}", status_code = "{{ record.status }}", content_type = "{{ record.content-type }}", length = "{{ record.length }}" }
