services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-m1nervac0nsole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:-m1nervac0nsole}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-m1nervac0nsole} -d ${POSTGRES_DB:-m1nervac0nsole}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  m1nervac0nsole:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentlab/m1nervac0nsole:${M1NERVAC0NSOLE_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      M1NERVAC0NSOLE_PG_DSN: postgres://${POSTGRES_USER:-m1nervac0nsole}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-m1nervac0nsole}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      M1NERVAC0NSOLE_LLM_PROVIDER: ${M1NERVAC0NSOLE_LLM_PROVIDER:-}
      M1NERVAC0NSOLE_LLM_MODEL: ${M1NERVAC0NSOLE_LLM_MODEL:-}
      M1NERVAC0NSOLE_LLM_BASE_URL: ${M1NERVAC0NSOLE_LLM_BASE_URL:-}
      M1NERVAC0NSOLE_LLM_PROXY: ${M1NERVAC0NSOLE_LLM_PROXY:-}
      # First-run protection. If empty, a random setup token is printed to the startup log, and
      # you must enter it on /setup to create the admin password (check with docker compose logs m1nervac0nsole).
      # Setting M1NERVAC0NSOLE_ADMIN_PASSWORD initializes immediately with that value, skipping /setup (8+ characters).
      M1NERVAC0NSOLE_SETUP_TOKEN: ${M1NERVAC0NSOLE_SETUP_TOKEN:-}
      M1NERVAC0NSOLE_ADMIN_PASSWORD: ${M1NERVAC0NSOLE_ADMIN_PASSWORD:-}
      # Browser cross-origin allowlist (comma-separated). The built-in UI is same-origin, so usually leave empty.
      M1NERVAC0NSOLE_CORS_ORIGINS: ${M1NERVAC0NSOLE_CORS_ORIGINS:-}
    ports:
      # Ports are published only on the host's 127.0.0.1 by default. To reach it from other machines, set
      # M1NERVAC0NSOLE_BIND=0.0.0.0 in .env, but first finish the initial setup (admin password) and,
      # if possible, use the reverse-proxy (HTTPS) setup described in the README.
      - "${M1NERVAC0NSOLE_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Binds the data directory (including jwt.key, SQLite, etc.) to data/ in the project root.
      # You can inspect and back it up from the host, and it survives container recreation.
      - ./data:/app/data
      # Mounts the project-root skills into the container (overrides /app/skills built into the image).
      # After editing a skill, the container reads the host file directly; no image rebuild is needed.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
