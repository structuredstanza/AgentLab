image: agentlab/m1nervac0nsole:deepseek-v1
pull_policy: never
cpus: 4
memory: 8G
workdir: /state
shell: /bin/bash
security: default
# /state is the persistent data volume: pcap ring, PostgreSQL, task files and
# exports. `quota` is in MiB; 153600 = 150 GiB.
# This is only the default: `lab` substitutes it at create time from
# AGENTLAB_STATE_QUOTA_GB (0 = no quota). The mount quota is fixed when the
# sandbox is created and `msb modify` cannot change it, so grow an existing
# volume with `./lab resize-state <GB>`.
mounts:
  - /mnt/Research/AgentLab/state:/state:quota=153600
  # The host build (`./lab build`, rebuilt automatically by `lab start` when a
  # source changed): binary, skills and guest scripts. The guest runs these, so
  # the image never needs a manual binary swap and nothing baked in can go stale.
  - /mnt/Research/AgentLab/deployment/guest-dist:/dist:ro
  - /mnt/Research/AgentLab/secrets/admin-password:/run/secrets/agentlab-admin:ro
  - /mnt/Research/AgentLab/secrets/native-proxy-token:/run/secrets/agentlab-native-proxy:ro
network:
  policy: public
  ports:
    - 127.0.0.1:8787:8787
labels:
  purpose: autonomous-task-trace-collection
  application: m1nervac0nsole
